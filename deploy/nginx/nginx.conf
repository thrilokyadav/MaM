#
# Production reverse proxy for the MAM platform.
#
# Terminates TLS, forwards to the Nuxeo application container, and serves
# the built mam-web SPA as static files. Aligned with the Technical
# Architecture Document (2.3.4 Reverse Proxy / Edge, 2.5.2 Hardware &
# Capacity Baselines).
#
# This file is mounted read-only into the nginx container by
# docker-compose.prod.yml:
#   ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#
# Certificates are expected at the paths under `ssl_certificate` /
# `ssl_certificate_key` below -- see README-DEPLOYMENT.md "SSL/TLS Setup"
# for how to populate ./nginx/certs/ with either Let's Encrypt or
# corporate-issued certificates.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ------------------------------------------------------------------
    # Large media uploads (MXF/MP4/MOV broadcast masters). 10G is a
    # ceiling, not a target -- most newsroom proxies/packages are far
    # smaller, but raw camera masters and archive ingests can be large.
    # Nginx buffers uploads to disk above client_body_buffer_size, so
    # this does not require 10G of RAM per concurrent upload.
    # ------------------------------------------------------------------
    client_max_body_size 10G;
    client_body_buffer_size 1M;
    client_body_timeout 300s;

    # Long-running operations behind the proxy: large blob uploads/
    # downloads and video transcode callbacks can legitimately take
    # minutes on big files. These are deliberately generous, not tuned
    # for a low-latency API.
    proxy_connect_timeout 75s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    proxy_buffering        on;
    proxy_buffer_size      16k;
    proxy_buffers          8 16k;
    proxy_busy_buffers_size 32k;
    proxy_request_buffering on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;
    # Never gzip video/binary payloads -- wasted CPU, no size benefit.

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # HTTP -> HTTPS redirect
    # ------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        # `_` matches any Host header -- this file is a static bind-mount
        # (not one of nginx's envsubst *.template files), so it cannot
        # read MAM_DOMAIN from .env directly. If you need strict virtual
        # host matching for a specific domain, replace `_` with your
        # domain name (e.g. mam.example.com) in both server blocks below.
        server_name _;

        # Certbot HTTP-01 challenge path, if using Let's Encrypt with the
        # webroot method (see README-DEPLOYMENT.md). Kept off the HTTPS
        # redirect so ACME validation requests succeed before a
        # certificate even exists.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS — main entry point
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # See the note on `server_name _;` in the HTTP server block above.
        server_name _;

        # --------------------------------------------------------------
        # TLS certificate paths. Placeholders -- replace via the
        # deployment's ./nginx/certs/ bind mount (see
        # README-DEPLOYMENT.md "SSL/TLS Setup"). Never commit real
        # certificate/key material into this repository.
        # --------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # HSTS -- 1 year, once you are certain HTTPS is stable for this
        # domain (HSTS is sticky in browsers; remove this line during
        # initial cert rollout if you need a fallback to plain HTTP).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # --------------------------------------------------------------
        # Nuxeo REST API + server (JWT Bearer auth; no cookies relied
        # upon by mam-web, see mam-web's nuxeoClient.ts docstring, but
        # X-Forwarded-* headers are still required so Nuxeo's own URL
        # generation, download links, and audit logging see the real
        # client IP/scheme rather than the internal Docker network's).
        # --------------------------------------------------------------
        location /nuxeo/ {
            proxy_pass http://nuxeo:8080/nuxeo/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Convenience alias: mam-web's nuxeoClient.ts talks to
        # `${VITE_NUXEO_BASE_URL}/api/v1/...`; if VITE_NUXEO_BASE_URL is
        # configured as `/nuxeo` at build time (the default), this block
        # is inert and every REST call already matches /nuxeo/ above.
        # Kept as an explicit alias only for deployments that choose to
        # expose the API at the shorter /api/ path instead.
        location /api/ {
            proxy_pass http://nuxeo:8080/nuxeo/api/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # --------------------------------------------------------------
        # mam-web static SPA (built React/Vite bundle). Served directly
        # by this nginx container from the mam-web-dist volume populated
        # by the mam-web-build init container (see
        # docker-compose.prod.yml). Client-side routing (React Router)
        # requires the SPA fallback below.
        # --------------------------------------------------------------
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }
}
